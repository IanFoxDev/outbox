apiVersion: apps/v1
kind: Deployment
metadata:
  name: outbox-relay
spec:
  replicas: 2
  # A new pod has to win the lock before it publishes. Replacing one pod at a time
  # keeps a standby ready during a rollout.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    spec:
      automountServiceAccountToken: false
      # On SIGTERM the relay stops; its database session closes and the standby can
      # take the lock. A batch cut short is sent again, consumers deduplicate.
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        # The nonroot user of the distroless image. Images up to 0.3 name it instead
        # of giving the number, and runAsNonRoot cannot check a name.
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: outbox-relay
      containers:
        - name: relay
          image: ghcr.io/ianfoxdev/outbox-relay
          envFrom:
            - configMapRef:
                name: outbox-relay
            - secretRef:
                name: outbox-relay
          env:
            - name: OUTBOX_HTTP_ADDR
              value: ":8080"
          ports:
            - name: http
              containerPort: 8080
          # Liveness only says the process runs. A broker or database outage makes the
          # relay not ready instead: a restart would not fix either (docs/relay.md).
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
