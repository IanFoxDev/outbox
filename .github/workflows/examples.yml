name: examples

on:
  push:
    branches: [master]
    paths: ["examples/**", "src/**", "schema/**", "relay/**", "composer.json", ".github/workflows/examples.yml"]
  pull_request:
    paths: ["examples/**", "src/**", "schema/**", "relay/**", "composer.json", ".github/workflows/examples.yml"]

jobs:
  example:
    name: ${{ matrix.app }} on ${{ matrix.db }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { app: laravel, db: postgres, files: compose.yaml }
          - { app: laravel, db: mysql, files: "compose.yaml:compose.mysql.yaml" }
          - { app: symfony, db: postgres, files: compose.yaml }
    # docker compose reads the file list from here, so the steps stay the same.
    env:
      COMPOSE_FILE: ${{ matrix.files }}
    defaults:
      run:
        working-directory: examples/${{ matrix.app }}
    steps:
      - uses: actions/checkout@v7
      # Builds the relay from this commit and installs the package from the checkout.
      - run: docker compose up -d --build --wait
      - run: docker compose exec -T app vendor/bin/phpunit
      - if: failure()
        run: docker compose logs
      - if: always()
        run: docker compose down -v
