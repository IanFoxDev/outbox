name: relay

on:
  push:
    branches: [master]
    paths: ["relay/**", "schema/**", ".github/workflows/relay.yml"]
  pull_request:
    paths: ["relay/**", "schema/**", ".github/workflows/relay.yml"]

defaults:
  run:
    working-directory: relay

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: outbox
          POSTGRES_PASSWORD: outbox
          POSTGRES_DB: outbox
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U outbox"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
      kafka:
        # The image's default config is a single KRaft node advertised as localhost:9092.
        image: apache/kafka:4.3.1
        ports: ["9092:9092"]
        options: >-
          --health-cmd "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092"
          --health-interval 5s
          --health-timeout 10s
          --health-retries 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: relay/go.mod
      - run: go vet ./...
      - run: go test -race ./...
        env:
          OUTBOX_TEST_DATABASE_URL: postgres://outbox:outbox@127.0.0.1:5432/outbox
          OUTBOX_TEST_KAFKA_BROKERS: 127.0.0.1:9092
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0
          working-directory: relay

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The final stage has no RUN step and Go cross-compiles, so no QEMU is needed.
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: relay
          platforms: linux/amd64,linux/arm64
          push: false
