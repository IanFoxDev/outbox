name: relay

on:
  push:
    branches: [master]
    paths: ["relay/**", ".github/workflows/relay.yml"]
  pull_request:
    paths: ["relay/**", ".github/workflows/relay.yml"]

defaults:
  run:
    working-directory: relay

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: relay/go.mod
      - run: go vet ./...
      - run: go test -race ./...
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0
          working-directory: relay
