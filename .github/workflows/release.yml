name: release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/ianfoxdev/outbox-relay
          # A release candidate (v1.0.0-rc1) gets only its own tag: metadata-action skips
          # the short patterns for pre-releases, and latest stays on the last stable one.
          # The major tag starts with 1.0; 0 would not mean anything stable.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}},enable=${{ !startsWith(github.ref_name, 'v0.') }}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
      - uses: docker/build-push-action@v7
        with:
          context: relay
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ github.ref_name }}

  github-release:
    runs-on: ubuntu-latest
    needs: image
    steps:
      - uses: actions/checkout@v7
      # The notes are the CHANGELOG section of this version, from its heading to the next one.
      - name: Release notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { found = 1; next }
            found && /^(## \[|\[[^]]+\]: )/ { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          test -s notes.md
      - uses: softprops/action-gh-release@v3
        with:
          body_path: notes.md
          prerelease: ${{ contains(github.ref_name, '-') }}
