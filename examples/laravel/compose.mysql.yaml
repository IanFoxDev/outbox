# The same shop on MySQL instead of PostgreSQL:
# docker compose -f compose.yaml -f compose.mysql.yaml up -d --build --wait
# docker compose -f compose.yaml -f compose.mysql.yaml exec app vendor/bin/phpunit
services:
  mysql:
    image: ${EXAMPLES_MYSQL_IMAGE:-mysql:8.4}
    environment:
      MYSQL_ROOT_PASSWORD: shop
      MYSQL_DATABASE: shop
      MYSQL_USER: shop
      MYSQL_PASSWORD: shop
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-ushop", "-pshop"]
      interval: 2s
      retries: 60

  app:
    environment:
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: "3306"
    depends_on:
      mysql: { condition: service_healthy }

  relay:
    environment:
      OUTBOX_DATABASE_URL: mysql://shop:shop@mysql:3306/shop
