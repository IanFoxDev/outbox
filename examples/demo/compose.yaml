# A shop that runs for weeks: the Laravel example under a steady stream of orders, two
# relay replicas from a released image, a consumer that adds up what customers paid,
# and Grafana showing whether the money in the shop and in the consumer still agree.
#
#   docker compose up -d --wait
#   open http://localhost:3000
#
# See README.md for what the dashboard shows and how the public instance is set up.
name: outbox-demo

x-relay: &relay
  image: ghcr.io/ianfoxdev/outbox-relay:${RELAY_TAG:-1.0.0}
  restart: unless-stopped
  environment:
    OUTBOX_DATABASE_URL: postgres://shop:shop@postgres:5432/shop
    OUTBOX_KAFKA_BROKERS: kafka:9092
    OUTBOX_LOCK_RETRY_INTERVAL: 2s
  depends_on:
    app: { condition: service_healthy }

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment: { POSTGRES_USER: shop, POSTGRES_PASSWORD: shop, POSTGRES_DB: shop }
    volumes: ["postgres:/var/lib/postgresql"]
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "shop"]
      interval: 2s
      retries: 30

  kafka:
    image: apache/kafka:4.3.1
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # Three days of events is enough to replay; weeks of them would fill a small disk.
      KAFKA_LOG_RETENTION_HOURS: 72
      KAFKA_HEAP_OPTS: -Xms512m -Xmx512m
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes: ["kafka:/var/lib/kafka/data"]
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-broker-api-versions.sh", "--bootstrap-server", "kafka:9092"]
      interval: 5s
      timeout: 10s
      retries: 30

  kafka-topics:
    image: apache/kafka:4.3.1
    depends_on: { kafka: { condition: service_healthy } }
    command: >-
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092
      --create --if-not-exists --topic order.events --partitions 3

  # The Laravel example as it is, with the package from this checkout.
  app:
    build: { context: .., dockerfile: php.Dockerfile }
    restart: unless-stopped
    volumes: ["../..:/src"]
    working_dir: /src/examples/laravel
    env_file: ../laravel/.env.example
    environment: { APP_ENV: production, APP_DEBUG: "false", LOG_LEVEL: warning }
    command: >
      sh -c "composer install --no-progress --no-interaction
      && php artisan migrate --force
      && frankenphp php-server --listen :8000 --root public"
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@fsockopen('127.0.0.1', 8000) ? 0 : 1);"]
      interval: 2s
      start_period: 300s
      retries: 150
    depends_on:
      postgres: { condition: service_healthy }
      kafka-topics: { condition: service_completed_successfully }

  relay-1: *relay
  relay-2: *relay

  # The consumer from the example, reading for as long as the stack runs.
  consumer:
    build: { context: .., dockerfile: php.Dockerfile }
    restart: unless-stopped
    volumes: ["../..:/src"]
    working_dir: /src/examples/laravel
    env_file: ../laravel/.env.example
    environment: { APP_ENV: production, APP_DEBUG: "false", LOG_LEVEL: warning }
    # It prints a line per event; the log would grow without end, so it goes nowhere.
    command: sh -c "php artisan orders:consume --idle=31536000 > /dev/null"
    # The image's health check asks for a web server, which the consumer is not.
    healthcheck: { disable: true }
    depends_on:
      app: { condition: service_healthy }

  # Per-customer totals on the shop side and the views Grafana reads, see stats.sql.
  stats:
    image: postgres:18-alpine
    environment:
      PGPASSWORD: shop
      GRAFANA_DB_PASSWORD: ${GRAFANA_DB_PASSWORD:-grafana}
    volumes: ["./stats.sql:/stats.sql:ro"]
    command: >-
      sh -c 'psql -h postgres -U shop -d shop -v ON_ERROR_STOP=1
      -v grafana_password="$$GRAFANA_DB_PASSWORD" -f /stats.sql'
    depends_on:
      app: { condition: service_healthy }

  traffic:
    image: curlimages/curl:8.16.0
    restart: unless-stopped
    volumes: ["./traffic.sh:/traffic.sh:ro"]
    entrypoint: ["sh", "/traffic.sh"]
    environment: { APP: "http://app:8000" }
    depends_on:
      app: { condition: service_healthy }

  prometheus:
    image: prom/prometheus:v3.5.0
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=45d
      # Anyone can query through the public dashboard; keep one query from eating the box.
      - --query.timeout=10s
      - --query.max-samples=5000000
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus:/prometheus

  grafana:
    image: grafana/grafana:12.1.0
    restart: unless-stopped
    ports: ["${GRAFANA_BIND:-127.0.0.1}:${GRAFANA_PORT:-3000}:3000"]
    environment:
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-http://localhost:3000/}
      # Read-only for everyone, and no login form to guess passwords at. Everything on
      # the dashboard comes from the provisioning files.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_AUTH_BASIC_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_SECURITY_COOKIE_SECURE: ${GRAFANA_COOKIE_SECURE:-false}
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/outbox.json
      GF_DASHBOARDS_MIN_REFRESH_INTERVAL: 30s
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GRAFANA_DB_PASSWORD: ${GRAFANA_DB_PASSWORD:-grafana}
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana:/var/lib/grafana
    depends_on:
      prometheus: { condition: service_started }
      stats: { condition: service_completed_successfully }

volumes:
  postgres:
  kafka:
  prometheus:
  grafana:
