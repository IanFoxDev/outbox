apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    url: http://prometheus:9090
    isDefault: true
    editable: false

  # Only the demo_stats.money view is readable with this role, see stats.sql.
  - name: Shop
    uid: shop
    type: grafana-postgresql-datasource
    url: postgres:5432
    user: grafana_ro
    editable: false
    jsonData:
      database: shop
      sslmode: disable
      postgresVersion: 1800
      maxOpenConns: 2
    secureJsonData:
      password: $GRAFANA_DB_PASSWORD
